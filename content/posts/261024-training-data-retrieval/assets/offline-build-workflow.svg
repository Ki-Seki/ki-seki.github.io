<text x="290" y="286" class="edge-label">Task plans</text>
<text x="1088" y="286" class="edge-label">Prepared in parallel</text>
<text x="276" y="950" class="edge-label">Full assignment plan</text>
<text x="276" y="976" class="edge-sub" style="font-size:15px">No need to wait for centroid training</text>
<text x="1051" y="676" class="edge-label">All vectors</text>
