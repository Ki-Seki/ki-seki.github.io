<g class="edge-group" data-from="embedding" data-to="assignment" data-kind="data"><path d="M1000 422 H1030 V1032 H1000" class="edge-halo"/><path d="M1000 422 H1030 V1032 H1000" class="edge data" marker-end="url(#arrow)"/></g>
