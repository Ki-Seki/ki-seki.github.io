<text x="670" y="1569" class="node-title">组装候选发布包</text>
<text x="670" y="1598" class="node-note">汇合：索引 + 回源信息 + 运行资产</text>
<text x="670" y="1624" class="node-note">可选统计按发布能力加入 manifest</text>
</g>
<g id="node-validate" class="dag-node" data-node="validate" data-depends-on="package" data-optional-depends-on="" aria-label="独立恢复与端到端验收，Devbox 或 UTP · 按 serving 预算">
<rect x="650" y="1730" width="440" height="120" rx="12" class="node-box"/>
<rect x="650" y="1730" width="5" height="120" rx="2" fill="#27764f"/>
<text x="670" y="1756" class="resource" fill="#27764f">Devbox 或 UTP · 按 serving 预算</text>
<text x="670" y="1789" class="node-title">独立恢复与端到端验收</text>
<text x="670" y="1812" class="node-note">恢复校验 → 启动 → 检索 / 读图 / 标注</text>
<text x="670" y="1836" class="node-note">自动检查通过，不等同于人工发布批准</text>
</g>
<g id="node-approve-release" class="dag-node human-node" data-node="approve-release" data-depends-on="validate" aria-label="人工复核典型结果并批准发布"><rect x="650" y="1920" width="440" height="64" rx="12" class="human-box"/><text x="670" y="1947" class="human-title">人工复核典型结果并批准发布</text><text x="670" y="1971" class="human-note">确认实际使用效果与发布范围</text></g>
<rect x="55" y="2010" width="1450" height="35" rx="8" fill="#f3f5f8"/>
<text x="75" y="2034" class="edge-sub">依赖未通过验收 → 不启动其下游；已完成且无依赖冲突的其他支路不必回滚。节点内部的分片还可以并行执行。</text>
</svg>
