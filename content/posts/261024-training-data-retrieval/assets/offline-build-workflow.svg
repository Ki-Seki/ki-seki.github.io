<text x="554" y="1403" class="edge-label">Centroids / PQ</text>
<text x="670" y="1210" class="edge-sub">Parallel; concurrency bounded by resource budget</text>
<text x="1110" y="1475" class="edge-label">Added to the package when enabled</text>
<text x="1110" y="1586" class="edge-label">Source mapping + query model / code</text>
<g id="node-approve-input" class="dag-node human-node" data-node="approve-input" data-depends-on="" aria-label="Human check of input scope and config"><rect x="560" y="24" width="440" height="64" rx="12" class="human-box"/><text x="580" y="51" class="human-title">Human check of input scope and config</text><text x="580" y="75" class="human-note">Data scope, model parameters, resource budget</text></g>
<g id="node-catalog" class="dag-node" data-node="catalog" data-depends-on="approve-input" data-optional-depends-on="" aria-label="Freeze input manifest, Single machine · CPU / controller">
