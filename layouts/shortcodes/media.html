{{- $src := .Get "src" -}}
{{- $caption := .Get "caption" -}}
{{- $width := .Get "width" -}}

<figure class="media-figure">
{{- if $width }}<div style="width: 100%; max-width: {{ $width }}; margin-left: auto; margin-right: auto;">{{ end -}}
{{/* ---------- YouTube ---------- */}}
{{- if or (hasPrefix $src "https://www.youtube.com/") (hasPrefix $src "https://youtu.be/") (hasPrefix $src "http://www.youtube.com/") (hasPrefix $src "http://youtu.be/") -}}
  {{- $videoId := "" -}}
  {{- if or (hasPrefix $src "https://youtu.be/") (hasPrefix $src "http://youtu.be/") -}}
    {{- $videoId = replaceRE ".*youtu\\.be/([a-zA-Z0-9_-]{11}).*" "$1" $src -}}
  {{- else -}}
    {{- $videoId = replaceRE ".*[?&]v=([a-zA-Z0-9_-]{11}).*" "$1" $src -}}
  {{- end -}}
  {{- $shortcode := printf "{{< youtube %s >}}" $videoId -}}
  {{ .Page.RenderString $shortcode }}

{{/* ---------- Vimeo ---------- */}}
{{- else if or (hasPrefix $src "https://vimeo.com/") (hasPrefix $src "http://vimeo.com/") -}}
  {{- $videoId := replaceRE ".*vimeo.com/([0-9]+)" "$1" $src -}}
  {{- $shortcode := printf "{{< vimeo %s >}}" $videoId -}}
  {{ .Page.RenderString $shortcode }}

{{/* ---------- Local/Remote Video ---------- */}}
{{- else if or (hasSuffix $src ".mp4") (hasSuffix $src ".webm") (hasSuffix $src ".ogg") (hasSuffix $src ".avi") (hasSuffix $src ".mov") -}}
  {{- $res := .Page.Resources.GetMatch $src -}}
  <video width="100%" controls>
    {{- if $res -}}
      <source src="{{ $res.RelPermalink }}" type="{{ cond (hasSuffix $src ".mp4") "video/mp4" (cond (hasSuffix $src ".webm") "video/webm" (cond (hasSuffix $src ".ogg") "video/ogg" (cond (hasSuffix $src ".avi") "video/x-msvideo" "video/quicktime"))) }}">
    {{- else if fileExists (printf "static/%s" $src) -}}
      <source src="{{ relURL $src }}" type="{{ cond (hasSuffix $src ".mp4") "video/mp4" (cond (hasSuffix $src ".webm") "video/webm" (cond (hasSuffix $src ".ogg") "video/ogg" (cond (hasSuffix $src ".avi") "video/x-msvideo" "video/quicktime"))) }}">
    {{- else -}}
      <source src="{{ $src }}">
    {{- end -}}
    Your browser does not support the video tag.
  </video>

{{/* ---------- Local/Remote Web Page (an interactive figure) ---------- */}}
{{- else if hasSuffix $src ".html" -}}
  {{- /* The page follows the site's theme and sets the frame's height itself; height is only the first guess */ -}}
  {{- $res := .Page.Resources.GetMatch $src -}}
  <iframe src="{{ with $res }}{{ .RelPermalink }}{{ else }}{{ cond (fileExists (printf "static/%s" $src)) (relURL $src) $src }}{{ end }}" title="{{ $caption | markdownify | plainify }}" loading="lazy" scrolling="no" style="display: block; width: 100%; height: {{ .Get "height" | default "600px" }}; border: 0;"></iframe>

{{/* ---------- Local/Remote Image ---------- */}}
{{- else -}}
  {{- $res := .Page.Resources.GetMatch $src -}}
  {{- $thumbRes := $res -}}
    {{- $pageDir := "" -}}
    {{- with .Page.File }}
      {{- $pageDir = .Dir -}}
    {{- end -}}
    {{- $isAbsolute := or (hasPrefix $src "/") (strings.HasPrefix $src "http://") (strings.HasPrefix $src "https://") -}}
    {{- $contentPath := "" -}}
    {{- $contentURL := "" -}}
    {{- if and $pageDir (not $isAbsolute) -}}
      {{- $contentPath = path.Join "content" $pageDir $src -}}
      {{- $contentURL = path.Join "/" $pageDir $src -}}
    {{- end -}}
    {{- $imageURL := "" -}}
    {{- if $res -}}
      {{- /* SVGs have no pixel size and are never resized */ -}}
      {{- if and (ne $res.MediaType.Type "image/svg+xml") (or (gt $res.Width 1280) (gt $res.Height 1280)) -}}
        {{- $processed := $res.Fit "1280x1280 q80" -}}
        {{- with $processed -}}
          {{- $thumbRes = . -}}
        {{- end -}}
      {{- end -}}
      {{- $imageURL = $res.RelPermalink -}}
    {{- else if fileExists (printf "static/%s" $src) -}}
      {{- $imageURL = relURL $src -}}
    {{- else if and $contentPath (fileExists $contentPath) -}}
      {{- $imageURL = relURL $contentURL -}}
    {{- else -}}
      {{- $imageURL = $src -}}
    {{- end -}}
    {{- $thumbURL := $imageURL -}}
    {{- /* Width and height reserve the image's space before it loads, so lazy images don't shift the page */ -}}
    {{- $w := "" -}}
    {{- $h := "" -}}
    {{- with $thumbRes -}}
      {{- $thumbURL = .RelPermalink -}}
      {{- if eq .MediaType.Type "image/svg+xml" -}}
        {{- with index (findRESubmatch `<svg[^>]*>` .Content 1) 0 -}}
          {{- $root := index . 0 -}}
          {{- $width := findRESubmatch `\swidth="([\d.]+)(px)?"` $root 1 -}}
          {{- $height := findRESubmatch `\sheight="([\d.]+)(px)?"` $root 1 -}}
          {{- $viewBox := findRESubmatch `\sviewBox="\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)\s*"` $root 1 -}}
          {{- if and $width $height -}}
            {{- $w = index $width 0 1 -}}
            {{- $h = index $height 0 1 -}}
          {{- else if $viewBox -}}
            {{- $w = index $viewBox 0 1 -}}
            {{- $h = index $viewBox 0 2 -}}
          {{- end -}}
        {{- end -}}
      {{- else if eq .ResourceType "image" -}}
        {{- $w = string .Width -}}
        {{- $h = string .Height -}}
      {{- end -}}
    {{- end -}}
    {{- $galleryID := printf "media-gallery-%s" (md5 .Page.RelPermalink) -}}
    {{- $captionText := "" -}}
    {{- with $caption -}}
      {{- $captionText = (strings.TrimSpace (. | markdownify | plainify)) -}}
    {{- end -}}
    <a href="{{ $imageURL }}" class="media-lightbox-trigger glightbox" data-gallery="{{ $galleryID }}"{{ if $captionText }} data-title="{{ $captionText }}"{{ end }}>
  <img src="{{ $thumbURL }}" alt="{{ $caption }}"{{ with $w }} width="{{ . }}" height="{{ $h }}"{{ end }} loading="lazy" style="max-width: 100%; height: auto;"{{ if $res }} data-fullsrc="{{ $imageURL }}"{{ end }}>
    </a>
{{- end -}}

{{/* ---------- Caption ---------- */}}
{{- if $width }}</div>{{ end -}}
{{- if $caption -}}
  <figcaption>
    <p>{{ $caption | markdownify }}</p>
  </figcaption>
{{- end -}}
</figure>
