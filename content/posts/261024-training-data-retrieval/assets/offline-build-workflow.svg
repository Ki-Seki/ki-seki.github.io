<rect x="1040" y="1230" width="5" height="132" rx="2" fill="#17637b"/>
<text x="1060" y="1256" class="resource" fill="#17637b">CPU · 协调器 / 分布式任务</text>
<text x="1060" y="1289" class="node-title">统计与浏览辅助数据</text>
<text x="1060" y="1318" class="node-note">统计汇总、diversity / 浏览元信息</text>
<text x="1060" y="1344" class="node-note">可选分支；与倒排归并无先后依赖</text>
</g>
<g id="node-faiss" class="dag-node" data-node="faiss" data-depends-on="postings training" data-optional-depends-on="" aria-label="FAISS 分片组装与校验，UTP CPU / 容量足够的 Devbox">
<rect x="100" y="1450" width="420" height="144" rx="12" class="node-box"/>
<rect x="100" y="1450" width="5" height="144" rx="2" fill="#17637b"/>
<text x="120" y="1476" class="resource" fill="#17637b">UTP CPU / 容量足够的 Devbox</text>
<text x="120" y="1509" class="node-title">FAISS 分片组装与校验</text>
<text x="120" y="1538" class="node-note">输入：postings + 冻结簇心 / PQ</text>
<text x="120" y="1564" class="node-note">产物：索引分片与查询校验凭证</text>
</g>
<g id="node-package" class="dag-node" data-node="package" data-depends-on="faiss runtime-assets" data-optional-depends-on="analysis" aria-label="组装候选发布包，Devbox · CPU / 打包控制">
