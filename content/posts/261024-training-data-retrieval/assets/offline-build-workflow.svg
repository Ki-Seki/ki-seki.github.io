<rect x="560" y="990" width="5" height="144" rx="2" fill="#6950a2"/>
<text x="580" y="1016" class="resource" fill="#6950a2">Cluster · multi-node GPU</text>
<text x="580" y="1049" class="node-title">Full assignment and PQ encoding</text>
<text x="580" y="1078" class="node-note">Waits for: all vectors + centroids/PQ + assignment plan</text>
<text x="580" y="1104" class="node-note">Output: global row, cluster ID, PQ code</text>
</g>
<g id="node-postings" class="dag-node" data-node="postings" data-depends-on="assignment" data-optional-depends-on="" aria-label="Inverted-list grouping and merge, Cluster · CPU node pool / I/O and memory">
