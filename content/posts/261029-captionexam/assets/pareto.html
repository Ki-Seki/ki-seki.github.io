<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaptionExam: accuracy against output tokens</title>
<style>
:root{--theme:rgb(255,255,255);--entry:rgb(255,255,255);--primary:rgb(30,30,30);--secondary:rgb(108,108,108);--tertiary:rgb(214,214,214);--content:rgb(31,31,31);--border:rgb(238,238,238);color-scheme:light}
:root[data-theme="dark"]{--theme:rgb(29,30,32);--entry:rgb(46,46,51);--primary:rgb(218,218,219);--secondary:rgb(155,156,157);--tertiary:rgb(65,66,68);--content:rgb(196,196,197);--border:rgb(51,51,51);color-scheme:dark}
body{margin:0;background:var(--theme);color:var(--content);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Open Sans","Helvetica Neue",sans-serif;font-size:18px;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:24px;color:var(--primary);margin:0 0 4px}h2{font-size:19px;color:var(--primary);margin:48px 0 2px}
p{margin:0 0 8px;font-size:15px;color:var(--secondary)}
.bar{display:flex;gap:8px;align-items:center;margin:8px 0 0;font-size:14px;color:var(--secondary)}
.bar button{font:inherit;padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:var(--entry);color:var(--primary);cursor:pointer}
.bar button[aria-pressed="true"]{border-color:var(--primary)}
html,body{background:transparent}main{max-width:none;padding:0}.ce-pareto{margin:0}</style>
<style>

margin:1.5em 0;position:relative}
:root[data-theme="dark"] .ce-pareto{--cp-muted:#7b7c7e;--cp-qwen:#3987e5;--cp-gpt:#d95926;--cp-quad:rgba(80,190,135,.10);--cp-quad-ink:#6cc39a;

--cp-s0:#1c5cab;--cp-s1:#2a78d6;--cp-s2:#5598e7;--cp-s3:#86b6ef;--cp-s4:#b7d3f6;--cp-s5:#a8461c;--cp-s6:#d95926;--cp-s7:#ec7a45;--cp-s8:#f5a477}

.ce-pareto .cp-dominated{fill:var(--cp-dom)}

.ce-pareto .cp-box,.ce-pareto .cp-box-key{fill:var(--cp-box)}
.ce-pareto .cp-cross{stroke:var(--cp-gpt);stroke-width:1.2;stroke-dasharray:5 4}
.ce-pareto .cp-halo{fill:var(--cp-gpt);opacity:.18}
.ce-pareto .cp-callout{font-size:13px;font-weight:600;fill:var(--cp-ink)}
.ce-pareto .s0-stroke{stroke:var(--cp-s0)}.ce-pareto .s1-stroke{stroke:var(--cp-s1)}.ce-pareto .s2-stroke{stroke:var(--cp-s2)}
.ce-pareto .s3-stroke{stroke:var(--cp-s3)}.ce-pareto .s4-stroke{stroke:var(--cp-s4)}.ce-pareto .s5-stroke{stroke:var(--cp-s5)}
.ce-pareto .s6-stroke{stroke:var(--cp-s6)}.ce-pareto .s7-stroke{stroke:var(--cp-s7)}.ce-pareto .s8-stroke{stroke:var(--cp-s8)}
.ce-pareto .cp-fam{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:.6;transition:opacity .12s}
.ce-pareto .cp-fam-hit{fill:none;stroke:transparent;stroke-width:10;cursor:pointer}
.ce-pareto .cp-fam-key{stroke-width:2}
.ce-pareto .cp-front-line,.ce-pareto .cp-front-key{fill:none;stroke:var(--cp-ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ce-pareto .cp-front-band{fill:none;stroke:var(--cp-ink);stroke-opacity:.1;stroke-width:12;stroke-linejoin:round;stroke-linecap:round}
.ce-pareto .cp-group{font-weight:600;color:var(--cp-ink);margin-right:-6px}
.ce-pareto .cp-break{flex-basis:100%;height:0}
.ce-pareto .cp-famlabs{display:none}
.ce-pareto.focus .cp-famlabs.on{display:inline}
.ce-pareto.focus .cp-pt:not(.on) .cp-dot{opacity:.12}
.ce-pareto.focus .cp-fam:not(.on){opacity:.07}
.ce-pareto.focus .cp-fam.on{opacity:1;stroke-width:2.6}
.ce-pareto.focus .static:not(.on){opacity:.18}
.ce-pareto.focus .cp-front-line:not(.on),.ce-pareto.focus .cp-front-band:not(.on){opacity:.35}
.ce-pareto .cp-key.on span{color:var(--cp-ink);font-weight:600}
.ce-pareto .fam-qwen-stroke{stroke:var(--cp-qwen)}.ce-pareto .fam-gpt-stroke{stroke:var(--cp-gpt)}
.ce-pareto .cp-soft{opacity:.7}
.ce-pareto .cp-fpath{display:none;fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ce-pareto.focus .cp-fpath.on{display:inline}
.ce-pareto .cp-thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.ce-pareto .cp-thumb{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:6px 6px 4px;border:1px solid var(--cp-grid);border-radius:6px;cursor:pointer;transition:border-color .12s,background .12s}
.ce-pareto .cp-thumb:hover,.ce-pareto .cp-thumb.on{border-color:var(--cp-ink2)}
.ce-pareto .cp-thumb:focus-visible{outline:2px solid var(--cp-qwen);outline-offset:2px}
.ce-pareto .cp-thumb-t{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:12px;line-height:1.25;color:var(--cp-ink2);white-space:nowrap}
.ce-pareto .cp-thumb-t b{color:var(--cp-ink);font-weight:600}
.ce-pareto .cp-thumb-t span{font-size:11px;font-variant-numeric:tabular-nums}
.ce-pareto .cp-thumb svg{display:block;width:100%;height:auto}
.ce-pareto .cp-tdot{fill:var(--cp-base)}
.ce-pareto .cp-tfront{fill:none;stroke:var(--cp-base);stroke-width:1}
.ce-pareto .cp-tpath{fill:none;stroke-width:1.4;stroke-linejoin:round}
.ce-pareto .cp-thumb-note{font-size:12px;line-height:1.4;color:var(--cp-ink2);align-self:center;padding:4px}
@media (max-width:560px){.ce-pareto .cp-thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}.ce-pareto .cp-thumb-t span{display:none}}
.ce-pareto .cp-aa-front,.ce-pareto .cp-aa-front-key{fill:none;stroke:var(--cp-ink);stroke-width:1.6;stroke-dasharray:5 4;stroke-linejoin:round;opacity:.75}
.ce-pareto.cp-g .cp-legend{display:block}
.ce-pareto .cp-row{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin-bottom:6px}
.ce-pareto .cp-row > .cp-key:first-child{min-width:150px}
.ce-pareto .cp-row > .cp-key:last-child:not(.cp-chip){margin-left:auto}
.ce-pareto .cp-chip{all:unset;display:inline-flex;align-items:center;padding:0 8px;border:1px solid var(--cp-grid);border-radius:999px;color:var(--cp-ink2);cursor:pointer;font-size:12px;line-height:20px}
.ce-pareto .cp-chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.ce-pareto .cp-chip i.fam-qwen{background:var(--cp-qwen)}.ce-pareto .cp-chip i.fam-gpt{background:var(--cp-gpt)}
.ce-pareto .cp-chip:hover,.ce-pareto .cp-chip.on{border-color:var(--cp-ink2);color:var(--cp-ink)}
.ce-pareto .cp-chip:focus-visible{outline:2px solid var(--cp-qwen);outline-offset:2px}
.ce-pareto.cp-g.focus .cp-lab:not(.on),.ce-pareto.cp-g.focus .cp-leader:not(.on){opacity:.12}
.ce-pareto.cp-g.focus .cp-lab.on{fill:var(--cp-ink)}
.ce-pareto.cp-g.focus .cp-aa-front:not(.on){opacity:.3}
@media (max-width:560px){.ce-pareto .cp-legend{padding-left:0}.ce-pareto .cp-row > .cp-key:first-child{min-width:0;flex-basis:100%}}
.ce-pareto .cp-tip{position:absolute;z-index:2;pointer-events:none;min-width:190px;padding:8px 10px;border-radius:6px;
background:var(--entry,#fff);color:var(--cp-ink);border:1px solid var(--cp-grid);box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:12.5px;line-height:1.5}
.ce-pareto .cp-tip b{display:block;font-size:13.5px}
.ce-pareto .cp-tip .k{color:var(--cp-ink2)}
.ce-pareto .cp-tip .row{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
</style><script>
(() => {
  if (window.__cePareto) return; window.__cePareto = true;
  const init = fig => {
    const data = JSON.parse(fig.querySelector('.cp-data').textContent);
    const tip = fig.querySelector('.cp-tip'), plot = fig.querySelector('.cp-plot');
    const labels = i => fig.querySelectorAll(`.cp-lab[data-i="${i}"]`);
    let pinned = null;
    const show = g => {
      const d = data[g.dataset.i], dot = g.querySelector('.cp-dot');
      fig.querySelectorAll('.cp-pt.hot,.cp-lab.hot').forEach(e => e.classList.remove('hot'));
      g.classList.add('hot'); labels(g.dataset.i).forEach(e => e.classList.add('hot'));
      tip.innerHTML = `<b>${d.n}</b><span class="k">${d.f}${d.fr ? ' · on the frontier' : ''}</span>` +
        `<div class="row"><span class="k">Accuracy</span><span>${d.y.toFixed(1)}%</span></div>` +
        `<div class="row"><span class="k">Omission</span><span>${d.o.toFixed(1)}%</span></div>` +
        `<div class="row"><span class="k">Hallucination</span><span>${d.h.toFixed(1)}%</span></div>` +
        `<div class="row"><span class="k">Output tokens</span><span>${d.x}</span></div>` +
        `<div class="row"><span class="k">Caption words</span><span>${d.w}</span></div>`;
      tip.hidden = false;
      const p = plot.getBoundingClientRect(), r = dot.getBoundingClientRect();
      const cx = r.left + r.width / 2 - p.left, cy = r.top + r.height / 2 - p.top;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let x = cx + 14, y = cy - h - 10;
      if (x + w > p.width) x = cx - w - 14;
      if (y < 0) y = cy + 14;
      tip.style.left = Math.max(0, x) + 'px'; tip.style.top = y + 'px';
    };
    const hide = () => {
      if (pinned) return;
      tip.hidden = true;
      fig.querySelectorAll('.hot').forEach(e => e.classList.remove('hot'));
    };
    fig.querySelectorAll('.cp-pt').forEach(g => {
      g.addEventListener('pointerenter', () => { if (!pinned) show(g); });
      g.addEventListener('pointerleave', hide);
      if (!fig.classList.contains('cp-fammode'))
        g.addEventListener('click', e => { e.stopPropagation(); pinned = pinned === g ? null : g; show(g); if (!pinned) hide(); });
    });
    document.addEventListener('click', () => { if (pinned) { pinned = null; hide(); } });
    if (fig.classList.contains('cp-fammode')) {
      // Highlight one family (or the frontier): hover to preview, click to keep it
      let pinnedKey = null;
      const focus = key => {
        fig.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
        fig.classList.toggle('focus', !!key);
        if (!key) return;
        const sel = key === 'front' ? '[data-front]' : key === 'qwen' || key === 'gpt' ? `[data-vendor="${key}"]` : `[data-fam="${key}"]`;
        fig.querySelectorAll(sel).forEach(e => e.classList.add('on'));
        fig.querySelectorAll(`.cp-key[data-key="${key}"]`).forEach(e => e.classList.add('on'));
      };
      const bind = (el, key) => {
        el.addEventListener('pointerenter', () => focus(key()));
        el.addEventListener('pointerleave', () => focus(pinnedKey));
        el.addEventListener('click', e => { e.stopPropagation(); pinnedKey = pinnedKey === key() ? null : key(); focus(pinnedKey || key()); });
      };
      fig.querySelectorAll('.cp-pt').forEach(g => bind(g, () => g.dataset.fam));
      fig.querySelectorAll('.cp-fam-hit').forEach(l => bind(l, () => l.dataset.fam));
      fig.querySelectorAll('.cp-key').forEach(k => {
        bind(k, () => k.dataset.key);
        k.addEventListener('focus', () => focus(k.dataset.key));
        k.addEventListener('blur', () => focus(pinnedKey));
      });
      document.addEventListener('click', () => { pinnedKey = null; focus(null); tip.hidden = true; });
      return;
    }
    // Legend: hover or focus a key to pick out its models
    const keys = fig.querySelectorAll('.cp-key');
    const pick = key => {
      const pts = [...fig.querySelectorAll('.cp-pt')].filter(g => g.dataset.keys.split(' ').includes(key));
      if (!pts.length) return;
      fig.classList.add('dim');
      pts.forEach(g => { g.classList.add('sel'); labels(g.dataset.i).forEach(e => e.classList.add('sel')); });
    };
    const unpick = () => { fig.classList.remove('dim'); fig.querySelectorAll('.sel').forEach(e => e.classList.remove('sel')); };
    keys.forEach(k => {
      k.addEventListener('pointerenter', () => pick(k.dataset.key));
      k.addEventListener('pointerleave', unpick);
      k.addEventListener('focus', () => pick(k.dataset.key));
      k.addEventListener('blur', unpick);
    });
  };
  const run = () => document.querySelectorAll('.ce-pareto:not([data-ready])').forEach(fig => { fig.dataset.ready = '1'; init(fig); });
  window.__ceParetoRun = run;
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', run) : run();
})();
</script>
</head>

<script>
(() => {
  const root = document.documentElement;
  let host = null;
  try { if (window.parent !== window) host = window.parent.document.documentElement; } catch (e) {}
  const apply = () => {
    root.dataset.theme = host ? (host.dataset.theme === 'dark' ? 'dark' : 'light')
      : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  };
  apply();
  if (host) new MutationObserver(apply).observe(host, { attributes: true, attributeFilter: ['data-theme'] });
  // The content's own height: the document's scrollHeight never drops below the frame it sits in
  const main = document.querySelector('main');
  const fit = () => { if (window.frameElement) window.frameElement.style.height = Math.ceil(main.getBoundingClientRect().height) + 'px'; };
  new ResizeObserver(fit).observe(main);
  addEventListener('load', fit);
})();
</script>
