<g class="edge-group" data-from="training" data-to="faiss" data-kind="data"><path d="M560 832 H540 V1410 H460 V1450" class="edge-halo"/><path d="M560 832 H540 V1410 H460 V1450" class="edge data" marker-end="url(#arrow)"/></g>
<g class="edge-group" data-from="assignment" data-to="postings" data-kind="data"><path d="M680 1134 V1180 H310 V1230" class="edge-halo"/><path d="M680 1134 V1180 H310 V1230" class="edge data" marker-end="url(#arrow)"/></g>
