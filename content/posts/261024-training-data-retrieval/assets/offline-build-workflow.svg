<text x="580" y="819" class="node-title">簇心与 PQ 码本训练</text>
<text x="580" y="848" class="node-note">同机串联：样本整理 → 中心选优 → PQ</text>
<text x="580" y="874" class="node-note">产物：冻结簇心、码本与质量凭证</text>
</g>
