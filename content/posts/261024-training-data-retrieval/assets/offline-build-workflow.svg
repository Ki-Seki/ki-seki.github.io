<text x="580" y="596" class="resource" fill="#17637b">UTP · CPU 并行读取</text>
<text x="580" y="629" class="node-title">训练样本抽取</text>
<text x="580" y="652" class="node-note">输入：采样计划 + 全量向量</text>
<text x="580" y="676" class="node-note">产物：训练样本候选与身份</text>
</g>
