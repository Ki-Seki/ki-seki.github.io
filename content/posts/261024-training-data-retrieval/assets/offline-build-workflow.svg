<rect x="1040" y="1230" width="5" height="132" rx="2" fill="#17637b"/>
<text x="1060" y="1256" class="resource" fill="#17637b">CPU · coordinator / distributed job</text>
<text x="1060" y="1289" class="node-title">Statistics and browsing data</text>
<text x="1060" y="1318" class="node-note">Summary stats, diversity / browsing metadata</text>
<text x="1060" y="1344" class="node-note">Optional branch; independent of the merge</text>
</g>
<g id="node-faiss" class="dag-node" data-node="faiss" data-depends-on="postings training" data-optional-depends-on="" aria-label="FAISS shard assembly and checks, Cluster CPU / large single machine">
<rect x="100" y="1450" width="420" height="144" rx="12" class="node-box"/>
<rect x="100" y="1450" width="5" height="144" rx="2" fill="#17637b"/>
<text x="120" y="1476" class="resource" fill="#17637b">Cluster CPU / large single machine</text>
<text x="120" y="1509" class="node-title">FAISS shard assembly and checks</text>
<text x="120" y="1538" class="node-note">Input: postings + frozen centroids / PQ</text>
<text x="120" y="1564" class="node-note">Output: index shards, query check report</text>
</g>
<g id="node-package" class="dag-node" data-node="package" data-depends-on="faiss runtime-assets" data-optional-depends-on="analysis" aria-label="Assemble release candidate, Single machine · CPU / packaging">
<rect x="650" y="1510" width="440" height="144" rx="12" class="node-box"/>
<rect x="650" y="1510" width="5" height="144" rx="2" fill="#17637b"/>
<text x="670" y="1536" class="resource" fill="#17637b">Single machine · CPU / packaging</text>
<text x="670" y="1569" class="node-title">Assemble release candidate</text>
<text x="670" y="1598" class="node-note">Joins: index + source lookup + runtime assets</text>
<text x="670" y="1624" class="node-note">Optional stats join the manifest if enabled</text>
</g>
<g id="node-validate" class="dag-node" data-node="validate" data-depends-on="package" data-optional-depends-on="" aria-label="Clean restore and end-to-end acceptance, Machine or cluster · per serving budget">
<rect x="650" y="1730" width="440" height="120" rx="12" class="node-box"/>
<rect x="650" y="1730" width="5" height="120" rx="2" fill="#27764f"/>
<text x="670" y="1756" class="resource" fill="#27764f">Machine or cluster · per serving budget</text>
<text x="670" y="1789" class="node-title">Clean restore and E2E acceptance</text>
<text x="670" y="1812" class="node-note">Restore check → start → search / images / labels</text>
<text x="670" y="1836" class="node-note">Passing automated checks is not release approval</text>
</g>
<g id="node-approve-release" class="dag-node human-node" data-node="approve-release" data-depends-on="validate" aria-label="Review typical results, approve release"><rect x="650" y="1920" width="440" height="64" rx="12" class="human-box"/><text x="670" y="1947" class="human-title">Review typical results, approve release</text><text x="670" y="1971" class="human-note">Confirm real-world quality and release scope</text></g>
<rect x="55" y="2010" width="1450" height="35" rx="8" fill="#f3f5f8"/>
<text x="75" y="2034" class="edge-sub">A dependency failing acceptance → its downstream steps don't start; finished branches with no conflicting dependency need no rollback. Shards within a step can also run in parallel.</text>
</svg>
