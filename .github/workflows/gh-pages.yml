name: Deploy Hugo Site to Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# Deploys from main share one queue and are never cancelled midway. Pull
# request builds only check the site, so each PR gets its own group: a new
# push to the PR cancels its older build without touching a deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.146.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Generate features sitemap
        run: |
          base_url="${{ steps.pages.outputs.base_url }}"
          base_url="${base_url%/}"
          sitemap="static/features/sitemap.xml"
          mkdir -p "$(dirname "${sitemap}")"
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n'
            printf '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
            if [ -d "static/features" ]; then
              find static/features -name "*.html" | sort | while IFS= read -r file; do
                rel="${file#static/}"
                printf '  <url>\n'
                printf '    <loc>%s/%s</loc>\n' "${base_url}" "${rel}"
                printf '  </url>\n'
              done
            fi
            printf '</urlset>\n'
          } > "${sitemap}"
          echo "Generated ${sitemap}:"
          cat "${sitemap}"
      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --baseURL ${{ steps.pages.outputs.base_url }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  # Deployment job
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
