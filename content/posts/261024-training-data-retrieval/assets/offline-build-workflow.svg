<rect x="100" y="1230" width="5" height="132" rx="2" fill="#17637b"/>
<text x="120" y="1256" class="resource" fill="#17637b">UTP · CPU 节点池 / I/O 与内存</text>
<text x="120" y="1289" class="node-title">倒排分组与归并</text>
<text x="120" y="1318" class="node-note">按簇归并分片编码记录</text>
<text x="120" y="1344" class="node-note">产物：postings、offsets 与行数</text>
</g>
<g id="node-analysis" class="dag-node" data-node="analysis" data-depends-on="assignment" data-optional-depends-on="" aria-label="统计与浏览辅助数据，CPU · 协调器 / 分布式任务">
