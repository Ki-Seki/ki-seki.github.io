<title id="title">One query across all index shards</title><desc id="desc">A query can be text, an image, or both; SigLIP2 encodes it into a 1,152-d vector q. q is searched against every IVF-PQ index shard in parallel, and the server merges the results, removes duplicates by sample ID and sorts them by distance into the top-K candidates.</desc>
