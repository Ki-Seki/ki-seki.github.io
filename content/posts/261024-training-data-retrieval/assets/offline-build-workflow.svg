<rect x="560" y="132" width="5" height="132" rx="2" fill="#17637b"/>
<text x="580" y="158" class="resource" fill="#17637b">Single machine · CPU / controller</text>
<text x="580" y="191" class="node-title">Freeze input manifest</text>
<text x="580" y="220" class="node-note">Data scope and source catalog</text>
<text x="580" y="246" class="node-note">Output: manifest, selection rules, task IDs</text>
</g>
