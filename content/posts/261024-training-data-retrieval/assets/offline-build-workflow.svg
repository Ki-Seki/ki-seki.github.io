<rect x="100" y="1230" width="5" height="132" rx="2" fill="#17637b"/>
<text x="120" y="1256" class="resource" fill="#17637b">Cluster · CPU node pool / I/O and memory</text>
<text x="120" y="1289" class="node-title">Inverted-list grouping and merge</text>
<text x="120" y="1318" class="node-note">Merge encoded shard records by cluster</text>
<text x="120" y="1344" class="node-note">Output: postings, offsets, row counts</text>
</g>
<g id="node-analysis" class="dag-node" data-node="analysis" data-depends-on="assignment" data-optional-depends-on="" aria-label="Statistics and browsing data, CPU · coordinator / distributed job">
