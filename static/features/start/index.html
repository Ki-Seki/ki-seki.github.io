<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FAFAF7">
<meta name="color-scheme" content="light dark">
<title>New Tab</title>
<link rel="icon" id="favicon" href="data:,">
<style>
:root {
  color-scheme: light dark;
  --sans: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif;
  --ease: cubic-bezier(.2, 0, 0, 1);
  --bg: #FAFAF7; --ink: #111111; --text-2: #4D4D4A; --text-3: #6F6F6B;
  --rule: rgba(17,17,17,.10); --rule-strong: rgba(17,17,17,.24);
  --danger: #B42318; --backdrop: rgba(250,250,247,.88);
  --toast-bg: #111111; --toast-fg: #FAFAF7; --sel-bg: #111111; --sel-fg: #FAFAF7;
}
/* Chinese UI: CJK fonts first so “” and · get full-width glyphs */
:root:lang(zh) { --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --ink: #EDEDE9; --text-2: #B4B4AE; --text-3: #8E8E88;
    --rule: rgba(237,237,233,.10); --rule-strong: rgba(237,237,233,.24);
    --danger: #F08C80; --backdrop: rgba(18,18,17,.88);
    --toast-bg: #EDEDE9; --toast-fg: #121211; --sel-bg: #EDEDE9; --sel-fg: #121211;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --ink: #EDEDE9; --text-2: #B4B4AE; --text-3: #8E8E88;
  --rule: rgba(237,237,233,.10); --rule-strong: rgba(237,237,233,.24);
  --danger: #F08C80; --backdrop: rgba(18,18,17,.88);
  --toast-bg: #EDEDE9; --toast-fg: #121211; --sel-bg: #EDEDE9; --sel-fg: #121211;
}
:root[data-theme="light"] { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; border-radius: 0; }
html { background: var(--bg); scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
  font: 400 15px/22px var(--sans);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
}
.no-transition *, .no-transition *::before, .no-transition *::after { transition: none !important; }
::selection { background: var(--sel-bg); color: var(--sel-fg); }
button, input, select { font: inherit; color: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
input { caret-color: var(--ink); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- sheet ---------- */
.page { width: min(760px, 100% - 96px); margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

/* running head */
.head { display: flex; justify-content: flex-end; align-items: center; padding-top: max(24px, env(safe-area-inset-top)); font-size: 13px; line-height: 20px; letter-spacing: .01em; }
:lang(zh) .head { letter-spacing: .02em; }
body.editing .head { position: sticky; top: 0; z-index: 5; background: var(--bg); }
.ctrls { display: flex; gap: 8px; margin-right: -8px; }
.word { display: inline-flex; align-items: center; height: 40px; padding: 0 8px; font-size: 13px; line-height: 20px; color: var(--text-3); white-space: nowrap; transition: color 120ms var(--ease); }
body.editing #editBtn { color: var(--ink); font-weight: 600; }
.edit-only { display: none; }
body.editing .edit-only { display: inline-flex; animation: fade-in 120ms var(--ease); }
body:not(.editing) .rest-only { animation: fade-in 120ms var(--ease); }
body.editing .rest-only { display: none; }

/* search line */
.search { position: relative; margin-top: clamp(64px, 18vh, 168px); }
#q {
  display: block; width: 100%; height: 56px; padding: 0 48px 0 0; border: 0; background: transparent;
  font-size: 28px; line-height: 36px; font-weight: 300; letter-spacing: -.015em; color: var(--ink);
  box-shadow: inset 0 -1px 0 var(--rule-strong); transition: box-shadow 160ms var(--ease);
  -webkit-appearance: none; appearance: none;
}
#q:focus { box-shadow: inset 0 -1px 0 var(--ink); }
#q:focus-visible { outline: none; }
#q::placeholder { color: var(--text-3); opacity: 1; }
#q::-webkit-search-cancel-button, #q::-webkit-search-decoration { -webkit-appearance: none; display: none; }
:lang(zh) #q { letter-spacing: 0; }
@media (max-resolution: 1.49dppx) { #q { font-weight: 400; } }
.clear { position: absolute; right: 0; top: 8px; width: 40px; justify-content: flex-end; padding: 0; }
/* the engine word inside the placeholder is the switch */
.ph {
  display: flex; align-items: center; position: absolute; left: 0; top: 0; right: 0; height: 56px;
  font-size: 28px; line-height: 36px; font-weight: 300; letter-spacing: -.015em; color: var(--text-3);
  white-space: pre; overflow: hidden; pointer-events: none;
}
:lang(zh) .ph { letter-spacing: 0; }
@media (max-resolution: 1.49dppx) { .ph { font-weight: 400; } }
.search.has-q .ph { display: none; }
.ph-eng, .eng-pick { cursor: pointer; text-decoration: underline dotted 1px; text-decoration-color: var(--rule-strong); transition: color 120ms var(--ease); }
.ph-eng { pointer-events: auto; font: inherit; letter-spacing: inherit; color: inherit; padding: 8px 0; text-underline-offset: 7px; }
.eng-pick { text-underline-offset: 4px; }
.tabhint { margin-left: 12px; font-size: 13px; color: var(--text-3); white-space: nowrap; }
@media (pointer: coarse) { .tabhint { display: none; } }

/* index / suggestions slot */
.slot { position: relative; margin-top: 64px; }
.bm-head {
  position: absolute; top: -48px; left: 0; right: 0;
  opacity: 0; visibility: hidden; transition: opacity 160ms var(--ease), visibility 0s 160ms;
}
body.editing .bm-head { opacity: 1; visibility: visible; transition-delay: 0s; }
.slot.searching .bm-head { display: none; }
/* edit mode sections: Bookmarks, Search engines, Settings */
.sec-head { display: flex; align-items: baseline; gap: 16px; min-width: 0; }
.sec-title { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.sec-head .hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 20px; color: var(--text-3); }
.index {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  column-gap: 40px; row-gap: 56px; align-items: start; transition: opacity 120ms var(--ease);
}
/* hidden at once so the two text layers never overlap; suggestions then fade in */
.slot.searching .index { position: absolute; top: 0; left: 0; right: 0; opacity: 0; visibility: hidden; transition: none; }
.suggest { animation: fade-in 120ms var(--ease); }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }

.group { min-width: 0; }
.group.empty, .group-new { display: none; }
body.editing .group.empty { display: block; }
/* '+ New group' closes the bookmarks the way '+ Add' closes a list */
body.editing .group-new { display: block; grid-column: 1 / -1; margin-top: -24px; }
.add-btn.new-btn { width: auto; }
.group.span-2 { grid-column: span 2; }
.group.span-3 { grid-column: span 3; }
.group.span-2 ul { column-count: 2; column-gap: 40px; }
.group.span-3 ul { column-count: 3; column-gap: 40px; }
.group.span-2 li, .group.span-3 li { break-inside: avoid; }
.label { margin: 0 0 12px; font: inherit; }
.label-btn {
  display: block; max-width: 100%; padding: 12px 0; margin: -12px 0; cursor: default;
  font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-decoration: underline dotted 1px transparent; text-underline-offset: 4px;
  transition: text-decoration-color 160ms var(--ease), color 120ms var(--ease);
  -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
}
:lang(zh) .label-btn { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: none; }
body.editing .label-btn { cursor: pointer; text-decoration-color: currentColor; }
.group ul { list-style: none; margin: 0; padding: 0; }
.row { position: relative; }
.link, .add-btn {
  display: block; width: 100%; padding: 5px 0; font-size: 15px; line-height: 22px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.link {
  color: var(--ink); text-decoration-line: underline; text-decoration-thickness: 1px; text-decoration-color: transparent; text-underline-offset: 4px;
  transition: text-decoration-color 120ms var(--ease), color 120ms var(--ease), box-shadow 160ms var(--ease), opacity 100ms var(--ease);
  -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.link:active { color: var(--text-2); }
body.editing .link { box-shadow: inset 0 -1px 0 var(--rule); -webkit-user-drag: none; }
.row.add { display: none; }
body.editing .row.add { display: block; animation: fade-in 160ms var(--ease); }
.add-btn { color: var(--text-3); transition: color 120ms var(--ease); }
.row.src .link, .group.src, .erow.src .eng-btn { opacity: .3; }
@media (pointer: fine) { body.editing .link, body.editing .label-btn, .eng-btn { cursor: grab; } }
@media (hover: hover) {
  .word:hover, .add-btn:hover, .btn:hover, .opt-btn:hover, .ph-eng:hover, .eng-pick:hover { color: var(--ink); }
  .eng-btn:hover .n { text-decoration: underline 1px; text-underline-offset: 4px; }
  .link:hover { text-decoration-color: var(--ink); }
  body.editing .link:hover { text-decoration-color: transparent; }
}
.ghost {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; padding: 4px 8px;
  background: var(--bg); border: 1px solid var(--rule-strong); color: var(--ink);
  font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ghost.is-group { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
:lang(zh) .ghost.is-group { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: none; }
.insert { position: fixed; left: 0; top: 0; height: 2px; background: var(--ink); z-index: 49; pointer-events: none; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }

.empty-state { grid-column: 1 / -1; margin: 0; color: var(--text-3); }
.empty-btn { min-height: 40px; color: var(--ink); text-decoration: underline 1px; text-underline-offset: 4px; }

/* suggestions */
.opt { display: flex; align-items: center; height: 40px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.opt .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.opt .h { flex-shrink: 1000; min-width: 0; overflow: hidden; text-overflow: ellipsis; margin-left: 12px; font-size: 13px; color: var(--text-3); }
.opt .k { margin-left: auto; padding-left: 16px; font-size: 13px; color: var(--text-3); visibility: hidden; }
.opt b { font-weight: 600; }
.opt[aria-selected="true"] { color: var(--ink); }
.opt[aria-selected="true"] .k { visibility: visible; }
@media (pointer: coarse) { .opt .k { display: none; } }

/* ---------- dialogs ---------- */
dialog {
  width: min(440px, 100% - 48px); max-width: none; padding: 32px;
  border: 1px solid var(--rule-strong); background: var(--bg); color: var(--ink); box-shadow: none;
}
dialog:focus-visible { outline: none; }
dialog[open] { animation: dlg-in 140ms var(--ease); }
dialog.closing { animation: dlg-out 100ms var(--ease) forwards; }
dialog::backdrop { background: var(--backdrop); animation: fade-in 140ms var(--ease); }
dialog.closing::backdrop { animation: fade-out 100ms var(--ease) forwards; }
@keyframes dlg-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes dlg-out { to { opacity: 0; transform: translateY(8px); } }
.dlg-title { margin: 0 0 24px; font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: -.01em; }
.fields { display: grid; gap: 24px; }
.field { display: block; }
.field-label { display: block; margin-bottom: 4px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .04em; color: var(--text-3); }
.input {
  display: block; width: 100%; height: 40px; padding: 8px 0; border: 0; background: transparent;
  font-size: 16px; line-height: 24px; color: var(--ink);
  box-shadow: inset 0 -1px 0 var(--rule-strong); transition: box-shadow 160ms var(--ease);
  -webkit-appearance: none; appearance: none;
}
.input:focus { box-shadow: inset 0 -2px 0 var(--ink); }
.input:focus-visible { outline: none; }
.input::placeholder { color: var(--text-3); opacity: 1; }
.input[aria-invalid="true"] { box-shadow: inset 0 -2px 0 var(--danger); }
.select { position: relative; display: block; }
.select::after { content: ""; position: absolute; right: 2px; top: 50%; width: 6px; height: 6px; border-right: 1px solid var(--text-3); border-bottom: 1px solid var(--text-3); transform: translateY(-75%) rotate(45deg); pointer-events: none; }
select.input { padding-right: 24px; cursor: pointer; }
select.input option { background: var(--bg); color: var(--ink); }
.err { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--danger); }
.actions { display: flex; align-items: center; gap: 8px; margin-top: 32px; }
.actions .sp { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 12px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-2); white-space: nowrap; transition: color 120ms var(--ease); }
.btn:first-child { margin-left: -12px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger { color: var(--danger); }
.btn.primary { background: var(--ink); color: var(--bg); font-weight: 600; padding: 0 20px; margin-left: 0; }

/* edit mode: search engines and settings laid flat under the bookmarks */
.prefs { display: none; }
body.editing .prefs { display: block; animation: fade-in 160ms var(--ease); }
.sec { margin-top: 80px; padding-top: 24px; border-top: 1px solid var(--rule); }
.sec .sec-head { margin-bottom: 16px; }
.sec-body { max-width: 520px; }
.engines { list-style: none; margin: 0; padding: 0; }
.eng-btn {
  display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 5px 0; font-size: 15px; line-height: 22px;
  color: var(--ink); white-space: nowrap; box-shadow: inset 0 -1px 0 var(--rule);
}
.eng-btn .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.eng-btn .h { flex-shrink: 1000; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--text-3); }
.eng-btn .def { margin-left: auto; padding-left: 12px; font-size: 13px; color: var(--text-2); }
.eng-note { display: block; margin-top: 6px; }
#eDefRow { cursor: pointer; }
.opt-btn:disabled { cursor: default; }
/* settings: a ruled table */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; padding: 6px 0; border-top: 1px solid var(--rule); }
.set-row.stack { display: block; padding-top: 14px; }
.set-label { font-size: 15px; line-height: 22px; }
.opts { display: flex; flex-wrap: wrap; justify-content: flex-end; column-gap: 4px; margin-right: -8px; }
.stack .opts { justify-content: flex-start; margin: 4px 0 0 -8px; }
/* padding widens the hit area; negative margins keep the text flush with the column */
.opt-btn { height: 40px; padding: 0 8px; font-size: 15px; color: var(--text-3); white-space: nowrap; transition: color 120ms var(--ease); }
.set-row > .opt-btn { min-width: 56px; margin-right: -8px; text-align: right; }
.set-row:has([data-switch]) { cursor: pointer; }
.opt-btn[aria-pressed="true"], .opt-btn[aria-checked="true"] { color: var(--ink); font-weight: 500; text-decoration: underline 1px; text-underline-offset: 5px; }
.opt-btn.danger { color: var(--danger); }
.note { margin: 0; font-size: 12px; line-height: 16px; color: var(--text-3); }

/* toast, aligned to the sheet's left edge */
.toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 60; pointer-events: none; }
.toast-col { width: min(760px, 100% - 96px); margin: 0 auto; }
.toast {
  display: inline-flex; align-items: center; gap: 16px; max-width: 400px; min-height: 40px; padding: 10px 16px;
  background: var(--toast-bg); color: var(--toast-fg); font-size: 14px; line-height: 20px; pointer-events: auto;
  opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity 120ms var(--ease), transform 120ms var(--ease), visibility 0s 120ms;
}
.toast.show { opacity: 1; visibility: visible; transform: none; transition: opacity 160ms var(--ease), transform 160ms var(--ease); }
.toast button { min-height: 40px; margin: -10px -8px -10px auto; padding: 0 8px; font-weight: 600; text-decoration: underline 1px; text-underline-offset: 3px; }

@media (pointer: coarse) {
  .word, .btn { height: 44px; }
  .link, .add-btn, .eng-btn { padding: 9px 0; } /* 40px rows on touch tablets; phones get 44px below */
  .ghost { padding-block: 8px; }
}

/* ---------- phones ---------- */
@media (max-width: 599px) {
  .page { width: 100%; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  .head { padding-top: max(12px, env(safe-area-inset-top)); }
  .word { height: 44px; }
  .search { margin-top: clamp(32px, 10vh, 80px); }
  #q { height: 52px; font-size: 22px; line-height: 30px; }
  .ph { height: 52px; font-size: 22px; line-height: 30px; }
  .clear { top: 6px; }
  .slot { margin-top: 52px; }
  .bm-head { top: -40px; }
  .sec-title { font-size: 18px; line-height: 24px; }
  .index { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; row-gap: 40px; }
  .group.span-2 ul { column-gap: 24px; }
  .label { margin-bottom: 8px; }
  .link, .add-btn, .eng-btn { font-size: 16px; line-height: 24px; padding: 10px 0; }
  .sec { margin-top: 56px; padding-top: 20px; }
  body.editing .group-new { margin-top: -16px; }
  .ghost { font-size: 16px; line-height: 24px; padding: 9px 8px; }
  .opt { height: 44px; }
  .btn { height: 44px; }
  dialog {
    margin: auto 0 0; width: 100%; max-width: 100%; max-height: 88dvh; overflow-y: auto;
    padding: 24px max(20px, env(safe-area-inset-right)) max(24px, calc(env(safe-area-inset-bottom) + 16px)) max(20px, env(safe-area-inset-left));
    border: 0; border-top: 1px solid var(--rule-strong);
  }
  dialog[open] { animation: sheet-in 180ms var(--ease); }
  dialog.closing { animation: sheet-out 100ms var(--ease) forwards; }
  .toast-wrap { bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px)); }
  .toast-col { width: auto; margin: 0 20px; }
  .toast { display: flex; max-width: none; }
}
@keyframes sheet-in { from { opacity: 0; transform: translateY(24px); } }
@keyframes sheet-out { to { opacity: 0; transform: translateY(24px); } }
@media (max-width: 339px) { .index { grid-template-columns: minmax(0, 1fr); } }
@media (max-height: 500px) and (orientation: landscape) {
  .search { margin-top: 24px; }
  .slot { margin-top: 44px; }
  .bm-head { top: -38px; }
}

@media (forced-colors: active) {
  #q, .input { box-shadow: none; border-bottom: 1px solid CanvasText; }
  body.editing .link { box-shadow: none; border-bottom: 1px solid CanvasText; }
  .insert { background: CanvasText; }
  .btn.primary { border: 1px solid ButtonText; }
  .toast, .ghost { border: 1px solid CanvasText; }
  :focus-visible { outline-color: Highlight; }
}
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after, ::backdrop { transition-duration: 0.01ms !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <nav class="ctrls">
      <button type="button" class="word" id="editBtn"></button>
      <button type="button" class="word rest-only" id="langBtn"></button>
    </nav>
  </header>
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <input id="q" type="search" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list"
      enterkeyhint="go" spellcheck="false" autocapitalize="off" autocorrect="off" data-i18n-label="searchLabel">
    <div class="ph"><span class="ph-a"></span><button type="button" class="ph-eng" id="phEng"></button><span class="ph-b"></span></div>
    <button type="button" class="word clear" id="clearBtn" data-i18n="clear" hidden></button>
  </form>
  <main class="slot" id="slot">
    <div class="sec-head bm-head"><h2 class="sec-title" data-i18n="bookmarks"></h2><span class="hint js-hint"></span></div>
    <div class="index" id="index" data-i18n-label="bookmarks" role="region"></div>
    <div class="suggest" id="suggest" role="listbox" data-i18n-label="suggestions" hidden></div>
  </main>
  <div class="prefs" id="prefs">
  <section class="sec" aria-labelledby="enginesCap">
    <div class="sec-head"><h2 class="sec-title" id="enginesCap" data-i18n="engines"></h2><span class="hint js-hint"></span></div>
    <ul class="engines sec-body" id="engines" aria-labelledby="enginesCap"></ul>
  </section>
  <section class="sec" aria-labelledby="settingsCap">
    <div class="sec-head"><h2 class="sec-title" id="settingsCap" data-i18n="settings"></h2></div>
    <div class="sec-body">

// Defaults for the editable engine list; %s marks where the query goes.
const DEFAULT_ENGINES = [
  { id: 'google',     name: 'Google',     url: 'https://www.google.com/search?q=%s' },
  { id: 'bing',       name: 'Bing',       url: 'https://www.bing.com/search?q=%s' },
  { id: 'perplexity', name: 'Perplexity', url: 'https://www.perplexity.ai/search?q=%s' },

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const darkMQ = mq('(prefers-color-scheme: dark)'), reduceMQ = mq('(prefers-reduced-motion: reduce)');
const fineMQ = mq('(hover: hover) and (pointer: fine)'), coarseMQ = mq('(pointer: coarse)');
const phoneMQ = mq('(max-width: 599px)');

function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } }
function normalizeUrl(raw) {
  let u = String(raw || '').trim();
  if (!u) return '';
  // "localhost:3000" or "example.com:8080" is host:port, not a scheme.
  const guessed = !/^[a-z][\w+.-]*:/i.test(u) || /^[\w.-]+:\d+([/?#]|$)/.test(u);
  if (guessed) u = (/^(localhost|127\.|\d+\.\d+\.\d+\.\d+)/.test(u) ? 'http://' : 'https://') + u;
  try {
    const p = new URL(u);
    // Without an explicit scheme, require something host-like ("example.com", "localhost:3000").
    if (guessed && !p.hostname.includes('.') && p.hostname !== 'localhost') return '';
    return p.href;
  } catch { return ''; }
}
function titleFromUrl(url) {
  const host = hostOf(url); if (!host) return '';
  const parts = host.split('.');
  const core = parts.length > 2 && parts[parts.length - 2].length <= 3 ? parts[parts.length - 3] : parts[Math.max(0, parts.length - 2)];
  return core.charAt(0).toUpperCase() + core.slice(1);
}
function looksLikeUrl(q) {
  return !/\s/.test(q) && (/^[a-z][\w+.-]*:\/\//i.test(q) || /^localhost(:\d+)?(\/|$)/i.test(q) ||
    /^[\w-]+(\.[\w-]+)*\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(q) || /^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/\S*)?$/.test(q));
}
const urlKey = (u) => u.toLowerCase().replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');

/* ---------- state ---------- */
const KEY = 'startpage.v2', OLD_KEY = 'startpage.v1';
const L = (title, url) => ({ id: uid(), title, url });
function defaults() {
  return {
    settings: { lang: 'en', theme: 'auto', engines: DEFAULT_ENGINES.map(e => ({ ...e })), engine: 'google', newTab: false },
    groups: [

        L('kiseki log', 'https://ki-seki.github.io/'),

      { id: uid(), key: '', name: 'util', links: [
        L('ouroboros', 'https://ki-seki.github.io/ouroboros/'),

      { id: uid(), key: '', name: 'fun', links: [
        L('fmhy', 'https://fmhy.net/'),

        L('murdoku', 'https://murdoku.com/'),

      { id: uid(), key: '', name: 'common', links: [

// Also migrates v1 data: accent, clock and name settings are dropped; icon is kept but never rendered.
function sanitize(s) {
  if (!s || !Array.isArray(s.groups)) return null;
  const i = s.settings || {};
  const engs = (Array.isArray(i.engines) ? i.engines : []).filter(e => e && e.name && e.url)
    .map(e => ({ id: String(e.id || uid()), name: String(e.name), url: String(e.url), ...(e.zh ? { zh: String(e.zh) } : {}) }));
  if (!engs.length) engs.push(...DEFAULT_ENGINES.map(e => ({ ...e })));
  return {
    settings: {
      lang: i.lang === 'zh' ? 'zh' : 'en',
      theme: ['light', 'dark'].includes(i.theme) ? i.theme : 'auto',
      engines: engs,
      engine: engs.some(e => e.id === i.engine) ? i.engine : engs[0].id,
      newTab: !!i.newTab
    },
    groups: s.groups.filter(g => g && Array.isArray(g.links)).map(g => ({
      id: String(g.id || uid()), key: ['favorites', 'tools', 'importedGroup'].includes(g.key) ? g.key : '', name: String(g.name || ''),
      links: g.links.filter(l => l && l.url).map(l => ({ id: String(l.id || uid()), title: String(l.title || ''), url: String(l.url), ...(l.icon ? { icon: String(l.icon) } : {}) }))
    }))

function load() {
  try {

}

let storageWarned = false, ver = 0;
function save() {
  ver++;

  catch {
    // A toast under an open dialog would go unseen; the warning waits for a visible moment.
    if (!storageWarned && !$('dialog[open]')) { storageWarned = true; toast(t('noStorage')); }
    return false;
  }
}

let state = load(), editing = false;
const S = () => state.settings;
const t = (k, vars) => {
  let s = (I18N[S().lang] || I18N.en)[k] ?? I18N.en[k] ?? k;
  if (vars) for (const v in vars) s = s.split(`{${v}}`).join(vars[v]);
  return s;
};
const groupName = (g) => g.name || (g.key ? t(g.key) : t('untitled'));
const engines = () => S().engines;
const engine = () => engines().find(e => e.id === S().engine) || engines()[0];
const engineName = (e = engine()) => (S().lang === 'zh' && e.zh) || e.name;
const searchUrl = (e, query) => e.url.includes('%s') ? e.url.split('%s').join(encodeURIComponent(query)) : e.url + encodeURIComponent(query);
const findGroup = (id) => state.groups.find(g => g.id === id);
const findLink = (id) => { for (const g of state.groups) { const i = g.links.findIndex(l => l.id === id); if (i > -1) return { g, i, link: g.links[i] }; } return null; };

const linkText = (l) => l.title || hostOf(l.url) || l.url;

/* ---------- elements ---------- */
const root = document.documentElement, body = document.body;
const q = $('#q'), clearBtn = $('#clearBtn');
const slot = $('#slot'), indexEl = $('#index'), sugEl = $('#suggest'), live = $('#live');
const linkDlg = $('#linkDlg'), groupDlg = $('#groupDlg'), engDlg = $('#engDlg');

/* ---------- theme + text ---------- */
function applyTheme() {

function updatePlaceholder() {

  $('.ph-a').textContent = a; $('.ph-b').textContent = b || '';

/* ---------- index ---------- */
function rowEl(l) {
  const li = h('li', 'row'); li.dataset.id = l.id;

  }
  state.groups.forEach(g => {
    const sec = h('section', 'group' + (g.links.length ? '' : ' empty')); sec.dataset.gid = g.id;
    const h2 = h('h2', 'label');
    const lb = h('span', 'label-btn', groupName(g));

    const ul = h('ul');

    add.append(ab); ul.append(add);
    sec.append(ul);

  const ng = h('div', 'group-new'), nb = h('button', 'add-btn new-btn', t('addGroup'));

function layout() {
  const cols = getComputedStyle(indexEl).gridTemplateColumns.split(' ').filter(Boolean).length || 1;
  $$('.group', indexEl).forEach(sec => {
    const n = findGroup(sec.dataset.gid)?.links.length || 0;
    const span = Math.min(cols, phoneMQ.matches ? 2 : 3, n > 24 ? 3 : n > 12 ? 2 : 1);

    if (a.scrollWidth > a.clientWidth) a.title = `${a.textContent} — ${hostOf(a.href)}`;
    else a.removeAttribute('title');

/* ---------- edit mode ---------- */

/* ---------- toast + undo ---------- */
const toastEl = $('#toast'), toastMsg = $('#toastMsg'), toastAct = $('#toastAct');

  const label = d.row ? d.row.querySelector('.link') : d.erow ? d.erow.querySelector('.n') : handle;
  const r = handle.getBoundingClientRect();
  d.started = true; d.moved = !d.hold; clearTimeout(d.timer); // a mouse drag starts by moving
  d.ox = d.px - r.left; d.oy = Math.min(Math.max(d.py - r.top, 0), r.height);
  try { src.setPointerCapture(d.pid); } catch {}
  d.ghost = h('div', d.grp ? 'ghost is-group' : 'ghost', label.textContent);
  d.ghost.style.width = (d.row ? r.width : Math.min(label.scrollWidth, r.width)) + 18 + 'px';
  d.line = h('div', 'insert');
  body.append(d.ghost, d.line);
  src.classList.add('src'); body.classList.add('dragging');
  suppressUntil = Date.now() + 1e9; // cleared to a short window on drop
  moveGhost(); if (d.moved) updateTarget(); autoScroll();
}
function moveGhost() { drag.ghost.style.transform = `translate3d(${drag.px - drag.ox - 9}px, ${drag.py - drag.oy}px, 0)`; }
// Nearest row by both x and y; each row's own rect gives the 2px insertion rule's position and width.
function updateTarget() {
  const d = drag; let best = null, bd = Infinity;
  if (d.grp) { updateGroupTarget(); return; }
  if (d.erow) { updateEngineTarget(); return; }
  $$('.row', indexEl).forEach(row => {
    const r = row.getBoundingClientRect(); if (!r.height) return;
    const dx = Math.max(r.left - d.px, 0, d.px - r.right), dy = Math.max(r.top - d.py, 0, d.py - r.bottom);
    const dist = dx * dx + dy * dy;
    if (dist < bd) { bd = dist; best = { row, r }; }
  });
  if (!best) return;
  const { row, r } = best, isAdd = row.classList.contains('add');
  const before = isAdd || d.py < r.top + r.height / 2;
  const g = findGroup(row.closest('.group').dataset.gid);
  const index = isAdd ? g.links.length : g.links.findIndex(l => l.id === row.dataset.id) + (before ? 0 : 1);
  d.target = { gid: g.id, index };
  d.line.style.width = r.width + 'px';
  d.line.style.transform = `translate3d(${r.left}px, ${(before ? r.top : r.bottom) - 1}px, 0)`;
}
// Groups sit in a grid: nearest group, before or after it by x; the rule stands in the column gap.
function updateGroupTarget() {
  const d = drag; let best = null, bd = Infinity;
  $$('.group', indexEl).forEach(sec => {
    const r = sec.getBoundingClientRect(); if (!r.height) return;
    const dx = Math.max(r.left - d.px, 0, d.px - r.right), dy = Math.max(r.top - d.py, 0, d.py - r.bottom);
    const dist = dx * dx + dy * dy;
    if (dist < bd) { bd = dist; best = { sec, r }; }
  });
  if (!best) return;
  const { sec, r } = best, before = d.px < r.left + r.width / 2;
  d.target = { index: state.groups.findIndex(g => g.id === sec.dataset.gid) + (before ? 0 : 1) };
  const gap = parseFloat(getComputedStyle(indexEl).columnGap) || 0;
  d.line.style.width = '2px'; d.line.style.height = r.height + 'px';
  d.line.style.transform = `translate3d(${(before ? r.left - gap / 2 : r.right + gap / 2) - 1}px, ${r.top}px, 0)`;
}
// Engines are one vertical list: nearest row by y, '+ Add' counts as the end.
function updateEngineTarget() {
  const d = drag; let best = null, bd = Infinity;
  $$('li', enginesEl).forEach(li => {
    const r = li.getBoundingClientRect(); if (!r.height) return;
    const dy = Math.max(r.top - d.py, 0, d.py - r.bottom);
    if (dy < bd) { bd = dy; best = { li, r }; }
  });
  if (!best) return;
  const { li, r } = best, isAdd = !li.dataset.id, before = isAdd || d.py < r.top + r.height / 2;
  d.target = { index: isAdd ? engines().length : engines().findIndex(x => x.id === li.dataset.id) + (before ? 0 : 1) };
  d.line.style.width = r.width + 'px';
  d.line.style.transform = `translate3d(${r.left}px, ${(before ? r.top : r.bottom) - 1}px, 0)`;
}
function autoScroll() {
  const d = drag; if (!d || !d.started) return;
  const E = 48, y = d.py;
  const v = y < E ? -Math.ceil((E - y) / E * 12) : y > innerHeight - E ? Math.ceil((y - innerHeight + E) / E * 12) : 0;
  if (v && d.moved) { scrollBy(0, v); updateTarget(); }
  d.raf = requestAnimationFrame(autoScroll);
}
function endDrag(commit) {
  const d = drag; drag = null;
  if (!d) return;
  clearTimeout(d.timer);
  if (d.fired) suppressUntil = Date.now() + 400;
  if (d.started) {
    cancelAnimationFrame(d.raf);
    d.ghost.remove(); d.line.remove();
    (d.row || d.erow || d.grp).classList.remove('src'); body.classList.remove('dragging');
    suppressUntil = Date.now() + 400;
    if (d.grp || d.erow) { (d.grp ? endGroupDrag : endEngineDrag)(d, commit); if (pendingSync) applySync(); return; }
    const f = findLink(d.row.dataset.id), tg = d.target && findGroup(d.target.gid);
    // An edit-mode touch held past HOLD_EDIT but released in place is a slow tap: open the link.
    if (commit && f && !d.moved && !d.fired) openLink(f.link.id);
    else if (commit && f && tg) {
      let idx = d.target.index;
      if (tg === f.g && idx > f.i) idx--;
      if (tg !== f.g || idx !== f.i) {
        const first = rowRects();
        commitMove(() => { f.g.links.splice(f.i, 1); tg.links.splice(idx, 0, f.link); });
        render(); flip(first); announceLink(f.link.id);
      }
    }
  }
  if (pendingSync) applySync();
}
function endGroupDrag(d, commit) {
  const gid = d.grp.dataset.gid, i = state.groups.findIndex(g => g.id === gid);
  if (!commit || i < 0) return;
  if (!d.moved && !d.fired) { openGroup(gid); return; } // slow tap in edit mode
  if (!d.target) return;
  let j = d.target.index; if (j > i) j--;
  if (j === i) return;
  const first = groupRects();
  commitMove(() => { const [g] = state.groups.splice(i, 1); state.groups.splice(j, 0, g); });
  render(); flip(first, '.group[data-gid]', 'gid'); announce(t('groupMoved', { i: j + 1 }));
}
function endEngineDrag(d, commit) {
  const id = d.erow.dataset.id, i = engines().findIndex(x => x.id === id);
  if (!commit || i < 0) return;
  if (!d.moved && !d.fired) { openEngine(id); return; } // slow tap on touch
  if (!d.target) return;
  let j = d.target.index; if (j > i) j--;
  moveEngine(i, j);
}
const rowRects = () => new Map($$('.row[data-id]', indexEl).map(el => [el.dataset.id, el.getBoundingClientRect()]));
const groupRects = () => new Map($$('.group[data-gid]', indexEl).map(el => [el.dataset.gid, el.getBoundingClientRect()]));
const engineRects = () => new Map($$('li[data-id]', enginesEl).map(el => [el.dataset.id, el.getBoundingClientRect()]));
function flip(first, sel = '.row[data-id]', key = 'id', scope = indexEl) {
  if (reduceMQ.matches) return;
  $$(sel, scope).forEach(el => {
    const a = first.get(el.dataset[key]); if (!a) return;
    const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (dx || dy) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 160, easing: 'cubic-bezier(.2,0,0,1)' });
  });
}

/* ---------- search: suggestions replace the index in place ---------- */
let items = [], sel = -1;
function go(url, newTab) { if (newTab) window.open(url, '_blank', 'noopener'); else location.href = url; }
function markMatch(text, lq) {
  const i = text.toLowerCase().indexOf(lq);
  return i < 0 || !lq ? esc(text) : esc(text.slice(0, i)) + '<b>' + esc(text.slice(i, i + lq.length)) + '</b>' + esc(text.slice(i + lq.length));
}
function updateSuggest() {
  const raw = q.value.trim(), lq = raw.toLowerCase();
  clearBtn.hidden = !q.value;
  $('#searchForm').classList.toggle('has-q', !!q.value);
  slot.classList.toggle('searching', !!raw);
  q.setAttribute('aria-expanded', String(!!raw));
  items = [];
  if (raw) {
    if (editing) setEditing(false);
    const scored = [];
    state.groups.forEach(g => g.links.forEach(l => {
      const title = linkText(l).toLowerCase(), u = urlKey(l.url);
      const score = title.startsWith(lq) ? 0 : u.startsWith(lq) ? 1 : title.includes(lq) ? 2 : u.includes(lq) ? 3 : -1;
      if (score > -1) scored.push({ score, l });
    }));
    const matches = scored.sort((a, b) => a.score - b.score).slice(0, 6).map(({ l }) => ({ type: 'link', link: l }));
    const search = { type: 'search', q: raw };
    const url = looksLikeUrl(raw) && normalizeUrl(raw);
    // Enter searches, except that a typed address opens, as in a browser's address bar; bookmarks follow.
    if (url) {
      const known = state.groups.some(g => g.links.some(l => urlKey(l.url) === urlKey(url)));
      items = [{ type: 'open', url }, search, ...(known ? [] : [{ type: 'save', url }]), ...matches];
    } else items = [search, ...matches];
  }
  sel = items.length ? 0 : -1;
  renderSuggest();
}
function renderSuggest() {
  sugEl.textContent = '';
  sugEl.hidden = !items.length;
  const lq = q.value.trim().toLowerCase();
  items.forEach((it, i) => {
    const o = h('div', 'opt'); o.id = 'opt-' + i; o.dataset.i = i;
    o.setAttribute('role', 'option'); o.setAttribute('aria-selected', String(i === sel));
    let html;
    if (it.type === 'link') html = `<span class="t">${markMatch(linkText(it.link), lq)}</span><span class="h">${esc(hostOf(it.link.url))}</span>`;
    else if (it.type === 'search') {
      // The engine name is tappable here too, so it can be switched mid-query.
      const [a, b] = t('searchFor').split('{q}'), name = engineName();
      const pick = `<span class="eng-pick" title="${esc(t('switchEngine', { e: name }))}">${esc(name)}</span>`;
      html = `<span class="t">${esc(a).replace('{e}', pick)}<b>${esc(it.q)}</b>${esc(b || '')}</span><span class="tabhint">${esc(t('tabSwitch'))}</span>`;
    }
    else if (it.type === 'open') { const [a, b] = t('open').split('{u}'); html = `<span class="t">${esc(a)}<b>${esc(it.url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</b>${esc(b || '')}</span>`; }
    else html = `<span class="t">${esc(t('saveUrl'))}</span>`;
    o.innerHTML = html + '<span class="k" aria-hidden="true">↵</span>';
    sugEl.append(o);
  });
  syncSel();
}
function syncSel() {
  $$('.opt', sugEl).forEach((o, i) => o.setAttribute('aria-selected', String(i === sel)));
  if (sel >= 0) q.setAttribute('aria-activedescendant', 'opt-' + sel); else q.removeAttribute('aria-activedescendant');
}
function activate(it, newTab) {
  if (!it) return;
  if (it.type === 'link') go(it.link.url, newTab || S().newTab);
  else if (it.type === 'open') go(it.url, newTab);
  else if (it.type === 'save') openLink(null, null, it.url);
  else go(searchUrl(engine(), it.q), newTab);
}
function clearSearch() { q.value = ''; updateSuggest(); }

// Switch engines from the placeholder word, the "Search X for ..." row, or Tab / Shift+Tab in the field.
function setEngine(id) {
  S().engine = id; save(); updatePlaceholder(); renderEngines();
  if (q.value.trim()) { const keep = sel; updateSuggest(); if (keep >= 0 && keep < items.length) { sel = keep; syncSel(); } }
}
function cycleEngine(dir) {
  const list = engines(), i = list.indexOf(engine());
  setEngine(list[(i + dir + list.length) % list.length].id);
}
const blink = (el) => { if (el && !reduceMQ.matches) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: 'ease-out' }); };
phEng.addEventListener('pointerdown', e => e.preventDefault()); // keep focus (and the phone keyboard) in the field
phEng.addEventListener('click', () => { cycleEngine(1); blink(phEng); q.focus({ preventScroll: true }); });
sugEl.addEventListener('click', e => {
  if (!e.target.closest('.eng-pick')) return;
  e.preventDefault(); e.stopImmediatePropagation();
  cycleEngine(1); blink($('.eng-pick', sugEl));
}, true);

q.addEventListener('input', updateSuggest);
q.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && items.length) {
    e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    syncSel();
  } else if (e.key === 'Escape') {
    e.preventDefault(); e.stopPropagation();
    // On desktop the field keeps focus so a Chinese IME is already active for the next query.
    if (q.value) clearSearch(); else if (!fineMQ.matches) q.blur();
  } else if (e.key === 'Tab' && !e.altKey && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); cycleEngine(e.shiftKey ? -1 : 1);
    blink(q.value.trim() ? $('.eng-pick', sugEl) : phEng);
  } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && q.value.trim()) {
    e.preventDefault();
    activate(items[sel] || { type: 'search', q: q.value.trim() }, true);
  }
});
$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const raw = q.value.trim(); if (!raw) return;
  activate(items[sel] || (normalizeUrl(raw) && looksLikeUrl(raw) ? { type: 'open', url: normalizeUrl(raw) } : { type: 'search', q: raw }), false);
});
sugEl.addEventListener('pointerdown', e => e.preventDefault()); // keep focus in the input
sugEl.addEventListener('click', e => { const o = e.target.closest('.opt'); if (o) activate(items[+o.dataset.i], e.metaKey || e.ctrlKey); });
sugEl.addEventListener('pointermove', e => { const o = e.target.closest('.opt'); if (o && +o.dataset.i !== sel) { sel = +o.dataset.i; syncSel(); } });
clearBtn.addEventListener('pointerdown', e => e.preventDefault());
clearBtn.addEventListener('click', () => { clearSearch(); q.focus(); });

/* ---------- running head ---------- */
$('#editBtn').addEventListener('click', () => setEditing(!editing));
$('#langBtn').addEventListener('click', () => setSetting('lang', S().lang === 'zh' ? 'en' : 'zh'));

/* ---------- global keys ---------- */
document.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  const mod = e.metaKey || e.ctrlKey, dlgOpen = !!$('dialog[open]');
  if (mod && e.key === ',') { e.preventDefault(); if (!dlgOpen) openPrefs(); return; }
  if (dlgOpen) return;
  if (e.key === 'Escape' && drag) { endDrag(false); return; }
  const tgt = e.target instanceof Element ? e.target : body;
  const editable = tgt.closest('input, textarea, select, [contenteditable]');
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'z' && !editable) {
    if (undoFn) { e.preventDefault(); runUndo(); } else if (lastMove) { e.preventDefault(); undoMove(); }
    return;
  }
  if (editable) return;
  const link = tgt.closest('.link');
  if (link && (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10'))) { e.preventDefault(); kbMenuAt = Date.now(); openLink(rowId(link)); return; }
  if (e.key === 'Escape') { if (editing) setEditing(false); return; }
  if (editing && editKeys(e)) return;
  if (mod || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); setEditing(false); q.focus(); return; }
  // Type anywhere to search: focus only, so the native keystroke (and any IME composition) lands in the field.
  if (e.key.length === 1 && e.key !== ' ') { setEditing(false); q.focus(); }
});

/* ---------- blank paper: exit edit mode, or (desktop, at rest) focus search ---------- */
let down = null;
document.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: e.target }; }, true);
document.addEventListener('pointerup', e => {
  const d = down; down = null;
  if (!d || Math.hypot(e.clientX - d.x, e.clientY - d.y) >= 8 || drag || Date.now() < suppressUntil || $('dialog[open]')) return;
  if (!(d.t instanceof Element) || d.t.closest('button, a, input, select, label, .row, .label, .head, .search, .suggest, .prefs, .toast-wrap, dialog')) return;
  if (editing) { if (e.pointerType === 'mouse' || !d.t.closest('.index')) setEditing(false); }
  else if (e.pointerType === 'mouse' && fineMQ.matches) q.focus({ preventScroll: true }); // IME-friendly way in
});

/* ---------- cross-tab sync ---------- */
function applySync() {
  pendingSync = false; ver++; state = load();
  if (undoFn) hideToast(); // its snapshot predates the other tab's change
  refresh();
}
addEventListener('storage', e => {
  if (e.key !== KEY) return;
  if (drag) pendingSync = true; else applySync(); // never re-render under the pointer
});

/* ---------- environment changes ---------- */
darkMQ.addEventListener?.('change', applyTheme);
coarseMQ.addEventListener?.('change', applyText);
phoneMQ.addEventListener?.('change', updatePlaceholder);
let resizeRaf;
addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(layout); });

/* ---------- init ---------- */
applyTheme(); applyText(); render(); syncPrefs();
if (migrated) save();
if (fineMQ.matches) q.focus({ preventScroll: true });
})();
</script>
