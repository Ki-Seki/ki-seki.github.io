<svg xmlns="http://www.w3.org/2000/svg" width="1124" height="290" viewBox="0 0 1124 290" role="img" aria-label="An image is captioned by the model under test; a text-only judge reads the caption and answers a question about the image; the verdict is correct, omission or hallucination.">
