<svg width="1560" height="2060" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 2060" role="img" aria-labelledby="svg-title svg-desc">
<style><![CDATA[

*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#1e2c3b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1600px;margin:0 auto;padding:30px 24px 42px}
header{margin:0 4px 22px}.kicker{margin:0 0 10px;color:#53647a;font-size:13px;letter-spacing:.08em}
h1{margin:0 0 12px;font-size:30px;line-height:1.35;font-weight:650}.subtitle{margin:0;max-width:1150px;color:#53647a;line-height:1.7;font-size:15px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:#475569}.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.cpu{background:#17637b}.gpu{background:#6950a2}.local{background:#27764f}.human{background:#b97817}
.line-key{display:inline-block;width:25px;border-top:2px solid #6a8095}.line-key.optional{border-top-style:dashed}.line-key.control{border-top-color:#b97817;border-top-style:dashed}
figure{margin:0;background:#fff;border:1px solid #d8e0e8;border-radius:16px;overflow:hidden}.diagram{overflow:auto;padding:20px 0 0}
svg{display:block;width:100%;height:auto;min-width:1180px}svg text{font-family:inherit}
.node-box{fill:#fff;stroke:#b7c8d8;stroke-width:1.4}.optional-box{fill:#f8fafb;stroke-dasharray:6 4}
.resource{font-size:16px;font-weight:600}.node-title{font-size:23px;fill:#1e344b;font-weight:600}.node-note{font-size:17px;fill:#53677a}
.edge-halo{stroke:#fff;stroke-width:7;fill:none;stroke-linejoin:round;stroke-linecap:round}.edge{stroke:#6a8095;stroke-width:1.7;fill:none;stroke-linejoin:round}
.edge.optional{stroke-dasharray:6 5}.edge.control{stroke:#b97817;stroke-dasharray:5 4}
.edge-label{font-size:17px;fill:#3d586e;paint-order:stroke;stroke:#fff;stroke-width:6;stroke-linejoin:round}
.edge-sub{font-size:16px;fill:#65788a;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
.human-box{fill:#fff7e9;stroke:#dfb369;stroke-width:1.3}.human-title{font-size:20px;fill:#855512;font-weight:600}.human-note{font-size:16px;fill:#855512}
figcaption{border-top:1px solid #e3e9ef;padding:18px 24px;font-size:14px;line-height:1.8;color:#526174}figcaption p{margin:0 0 7px}figcaption p:last-child{margin-bottom:0}figcaption strong{color:#293e54;font-weight:600}
details{margin-top:20px;padding:16px 20px;border:1px solid #d8e0e8;border-radius:12px;background:#fff}summary{font-size:15px;font-weight:600;cursor:pointer}.details-note{font-size:13px;line-height:1.7;color:#5c6e80}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}th,td{padding:10px 12px;border-bottom:1px solid #e8edf2;text-align:left;vertical-align:top;line-height:1.6}th{color:#52677c;font-weight:600}td:first-child{width:140px}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
.footer{font-size:12px;color:#6b7a8a;margin:16px 4px 0}
@media(max-width:700px){main{padding:20px 12px}h1{font-size:24px}.subtitle{font-size:14px}.legend{gap:12px}figcaption{padding:14px}.table-wrap{overflow:auto}table{min-width:640px}}
@media print{@page{size:A3 portrait;margin:10mm}body{background:#fff}main{max-width:none;padding:0}header{margin-bottom:10px}h1{font-size:23px}figure{border:0}.diagram{overflow:visible;padding:0}svg{min-width:0;width:100%}details,.footer{display:none}figcaption{font-size:10px;padding:8px 0}.subtitle,.legend{font-size:11px}}

svg{width:1560px;height:2060px;min-width:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
]]></style>
<rect width="1560" height="2060" fill="#ffffff"/>

<title id="svg-title">Offline index build: a DAG with resource annotations</title>
<desc id="svg-desc">Once the inputs are frozen, task planning, distributed embedding and runtime asset preparation can run in parallel. Sampling depends on both the sample plan and the embeddings; centroids and PQ are trained on the samples. Full encoding joins all vectors, the centroids and PQ, and the assignment plan, then branches into the inverted-list merge and the optional statistics. FAISS assembly also reads the trained centroids and PQ. The index, runtime assets and chosen statistics join in the release package, followed by restore acceptance and human release approval.</desc>
