<text x="80" y="376" class="resource" fill="#17637b">Single machine / small CPU job</text>
<text x="80" y="409" class="node-title">Sample and full assignment plans</text>
<text x="80" y="438" class="node-note">Prepare both plans; no need to wait for training</text>
