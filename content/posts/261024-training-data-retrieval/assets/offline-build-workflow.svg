<text x="1088" y="286" class="edge-label">可并行准备</text>
<text x="280" y="950" class="edge-label">全量分配计划</text>
<text x="280" y="976" class="edge-sub">无需等待簇心训练结束再准备</text>
<text x="1051" y="676" class="edge-label">全量向量</text>
<text x="1051" y="702" class="edge-sub">直接供全量编码；不是只编码样本</text>
<text x="800" y="953" class="edge-label">簇心 / PQ</text>
<text x="554" y="1403" class="edge-label">簇心 / PQ</text>
<text x="670" y="1210" class="edge-sub">可并行；实际并发受资源预算约束</text>
<text x="1110" y="1475" class="edge-label">启用该能力时加入包</text>
<text x="1110" y="1586" class="edge-label">回源映射 + 查询模型 / 代码</text>
<g id="node-approve-input" class="dag-node human-node" data-node="approve-input" data-depends-on="" aria-label="人工确认输入范围与配置"><rect x="560" y="24" width="440" height="64" rx="12" class="human-box"/><text x="580" y="51" class="human-title">人工确认输入范围与配置</text><text x="580" y="75" class="human-note">数据口径、模型参数与资源预算</text></g>
