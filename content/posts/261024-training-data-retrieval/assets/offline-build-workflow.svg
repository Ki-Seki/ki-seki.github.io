<rect x="560" y="990" width="5" height="144" rx="2" fill="#6950a2"/>
<text x="580" y="1016" class="resource" fill="#6950a2">UTP · 多节点 GPU</text>
<text x="580" y="1049" class="node-title">全量分配与 PQ 编码</text>
<text x="580" y="1078" class="node-note">等待：全量向量 + 簇心/PQ + 分配计划</text>
<text x="580" y="1104" class="node-note">产物：global row、cluster ID、PQ code</text>
</g>
<g id="node-postings" class="dag-node" data-node="postings" data-depends-on="assignment" data-optional-depends-on="" aria-label="倒排分组与归并，UTP · CPU 节点池 / I/O 与内存">
